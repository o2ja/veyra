# Local development stack (DEPLOYMENT.md §2.2). Secrets come from ../../.env (never committed).
# Services: postgres, mailpit, api, worker, frontend; profile `s2` (enabled by the Makefile from S2 on):
# seaweedfs (S3, ADR-017) and clamav (malware scanning).
name: veyra-recover

x-app-env: &app-env
  APP_ENV: local
  SECRET_KEY: ${SECRET_KEY:?set in .env}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set in .env (make env, or see .env.example)}
  DATABASE_URL: postgresql+psycopg://rebate_app:${REBATE_APP_PASSWORD}@postgres:5432/rebate
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT_URL: http://localhost:8333  # presigned URLs are opened by the browser
  S3_BUCKET: rebate-files
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
  CLAMD_HOST: clamav
  CLAMD_PORT: "3310"
  DATABASE_URL_AI: postgresql+psycopg://rebate_ai_writer:${REBATE_AI_WRITER_PASSWORD}@postgres:5432/rebate
  AI_PROVIDER: ${AI_PROVIDER:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_PRICE_INPUT_PER_MTOK: ${AI_PRICE_INPUT_PER_MTOK:-}
  AI_PRICE_OUTPUT_PER_MTOK: ${AI_PRICE_OUTPUT_PER_MTOK:-}

services:
  postgres:
    # 64 MB Docker default is too small for parallel query DSM on large tables (S3 1M-row run)
    shm_size: 1g
    image: postgres:16.15-trixie@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      REBATE_OWNER_PASSWORD: ${REBATE_OWNER_PASSWORD:?set in .env}
      REBATE_APP_PASSWORD: ${REBATE_APP_PASSWORD:?set in .env}
      REBATE_AI_WRITER_PASSWORD: ${REBATE_AI_WRITER_PASSWORD:?set in .env}
      REBATE_READONLY_PASSWORD: ${REBATE_READONLY_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts:/opt/rebate-scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  seaweedfs:
    profiles: ["s2"]
    image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    entrypoint: ["sh", "/opt/seaweedfs/start.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
      WEED_S3_SSE_KEY: ${SEAWEEDFS_SSE_KEY:?set in .env}  # enables SSE-S3 (AES256)
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweeddata:/data
      - ../seaweedfs:/opt/seaweedfs:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z $$(hostname -i) 8333"]
      interval: 3s
      timeout: 3s
      retries: 40

  clamav:
    profiles: ["s2"]
    image: clamav/clamav:1.4.6-debian13-slim@sha256:aedee9daad6b069b26adad61af7ec50a41efe33fd8eff7f985c1f31e3a6ae9de
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}  # signatures ship in the image; daily updates on
    volumes:
      - ../clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60

  api:
    build:
      context: ../../backend
      target: dev
    command: uvicorn rebate.api.asgi:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    environment:
      <<: *app-env
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}  # shortened only for manual expiry checks
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../../backend:/app
      - ../../testdata:/testdata:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    profiles: ["s2"]
    build:
      context: ../../backend
      target: dev
    command: python -m rebate.workers
    environment:
      <<: *app-env
      SMTP_HOST: mailpit
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      target: dev
    environment:
      VITE_DEV_API_PROXY: http://api:8000
      VITE_POLL: "1"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
  frontend_node_modules:
