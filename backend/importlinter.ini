[importlinter]
root_packages =
    rebate
    rebate_engine
    rebate_matching
include_external_packages = True

[importlinter:contract:engine-purity]
name = rebate_engine is pure (no app, DB, web, network, randomness)
type = forbidden
source_modules =
    rebate_engine
forbidden_modules =
    rebate
    rebate_matching
    fastapi
    starlette
    sqlalchemy
    psycopg
    alembic
    structlog
    pydantic_settings
    uuid_utils
    httpx
    random
    secrets
    socket
    urllib
    http
    time

[importlinter:contract:matching-purity]
name = rebate_matching is pure (no app, DB, web, network, randomness)
type = forbidden
source_modules =
    rebate_matching
forbidden_modules =
    rebate
    rebate_engine
    fastapi
    starlette
    sqlalchemy
    psycopg
    alembic
    structlog
    pydantic_settings
    uuid_utils
    httpx
    random
    secrets
    socket
    urllib
    http
    time

[importlinter:contract:layers]
name = api -> workers -> modules -> core (lower layers never import higher ones)
type = layers
layers =
    rebate.api
    (rebate.workers)
    rebate.modules
    rebate.core

[importlinter:contract:modules-acyclic]
name = business modules have no dependency cycles
type = acyclic_siblings
ancestors =
    rebate.modules

# One `protected` contract per business module, added with the module (S1+):
# internals of rebate.modules.<name> may only be imported by rebate.modules.<name> itself.
# tests/unit/test_boundaries.py fails if a module exists without its contract.

[importlinter:contract:audit-internals]
name = audit internals are private to the module (others use rebate.modules.audit)
type = protected
protected_modules =
    rebate.modules.audit.*
allowed_importers =
    rebate.modules.audit
    rebate.modules.audit.*
    rebate.api.*

[importlinter:contract:identity-internals]
name = identity internals are private to the module (others use rebate.modules.identity)
