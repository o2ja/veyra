[project]
name = "rebate"
version = "0.1.0"
description = "Veyra Recover backend (API, worker, pure engine and matching packages)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.2",
    "gunicorn==26.2.0",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "structlog==26.1.0",
    "uuid-utils==1.2.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "httpx==0.28.1",
    "hypothesis==6.170.15",
    "import-linter==2.16",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebate", "src/rebate_engine", "src/rebate_matching"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
ignore = ["N818"]  # domain errors are named by meaning (DomainError subclasses)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rebate_engine.*", "rebate_matching.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=rebate --cov=rebate_engine --cov=rebate_matching --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
