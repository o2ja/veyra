name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.10"
  UV_VERSION: "0.13.7"
  NODE_VERSION: "24.22.1"

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-trixie@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:  # integration tests check email delivery through Mailpit's API
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_MAILPIT_URL: http://localhost:8025
      TEST_SMTP_HOST: localhost
      S3_ENDPOINT_URL: http://localhost:8333
      S3_ACCESS_KEY_ID: ci-s3-access
      S3_SECRET_ACCESS_KEY: ci-s3-secret-not-sensitive
      CLAMD_HOST: localhost
      CLAMD_PORT: "3310"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-postgres
      REBATE_OWNER_PASSWORD: ci-owner
      REBATE_APP_PASSWORD: ci-app
      REBATE_AI_WRITER_PASSWORD: ci-ai
      REBATE_READONLY_PASSWORD: ci-ro
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:ci-postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: start SeaweedFS and ClamAV (real services for the S2 tests, ADR-017)
        working-directory: .
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e WEED_S3_SSE_KEY="$(openssl rand -hex 32)" \
            -v "$PWD/infra/seaweedfs:/opt/seaweedfs:ro" --entrypoint sh \
            chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860 /opt/seaweedfs/start.sh
          docker run -d --name clamav -p 3310:3310 -e CLAMAV_NO_FRESHCLAMD=true \
            -v "$PWD/infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            clamav/clamav:1.4.6-debian13-slim@sha256:aedee9daad6b069b26adad61af7ec50a41efe33fd8eff7f985c1f31e3a6ae9de
          for i in $(seq 120); do nc -z localhost 8333 && break; sleep 1; done
          for i in $(seq 180); do docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break; sleep 2; done
          docker exec clamav clamdcheck.sh
          sleep 5  # SeaweedFS filer and S3 gateway settle after the port opens
      - name: init-db (roles, database, extensions)
        run: bash ../infra/scripts/init-db.sh && bash ../infra/scripts/init-db.sh
      - name: migrate empty -> head as rebate_owner
        env:
          DATABASE_URL_OWNER: postgresql+psycopg://rebate_owner:ci-owner@localhost:5432/rebate
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports --config importlinter.ini
      - run: uv run bandit -q -c pyproject.toml -r src migrations
      - name: pip-audit (locked dependencies)
        run: |
          uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt" -q
          uv run pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/req.txt"
      - name: licence matcher self-check
        run: python3 ../infra/scripts/ops/test_licence_check.py
      - name: licence check (runtime dependencies; fails on GPL/AGPL/SSPL/unknown, lists weak copyleft)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/req-runtime.txt" -q
          uv run python ../infra/scripts/ops/licence_check.py python "$RUNNER_TEMP/req-runtime.txt"
      - name: OCR tools for the extraction tests (the worker image has them; S6.1)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ocrmypdf tesseract-ocr-eng
      - run: uv run pytest --junitxml=junit-backend.xml
      - name: no skipped tests
        run: python3 ../infra/scripts/check-no-skips.py junit-backend.xml
      - name: isolation negative control (RLS disabled in throwaway DB rebate_negctl)
        run: uv run python -m tests.isolation.negative_control
      - name: worked examples in BUSINESS_LOGIC.md
        working-directory: .
        run: python3 -I testdata/verify_business_logic_examples.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit-frontend.xml
      - name: no skipped tests
        run: python3 ../infra/scripts/check-no-skips.py junit-frontend.xml
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=high
      - name: licence check (runtime dependencies)
        run: python3 ../infra/scripts/ops/licence_check.py npm package-lock.json

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --directory backend
      - run: npm ci --no-fund --prefix frontend
      - name: regenerate OpenAPI + TypeScript client and fail on drift
        run: |
          uv run --directory backend python -m rebate.api > frontend/src/api/openapi.json
          npm run gen:api --prefix frontend
          git diff --exit-code -- frontend/src/api

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1 git --no-banner --redact -v .

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target runtime -t rebate-api:ci backend
      - name: runtime image runs as non-root and imports the app
        run: |
          test "$(docker run --rm --entrypoint id rebate-api:ci -u)" = "10001"
          docker run --rm --entrypoint python rebate-api:ci -c "import rebate.api.app, uvicorn.workers"
      - run: docker build --target static -t rebate-frontend:ci frontend
      - name: production compose file is valid (placeholders only)
        run: docker compose --env-file .env.prod.example -f infra/docker/compose.prod.yml --profile ops config -q
      - name: trusted proxy IP matches caddy's address on the api network
        run: python3 infra/scripts/check-proxy-config.py .env.prod.example infra/docker/compose.prod.yml
      - name: Caddyfile is valid
        run: >
          docker run --rm -e APP_DOMAIN=localhost -e S3_DOMAIN=files.localhost -v "$PWD/infra/caddy:/etc/caddy:ro"
          caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
          caddy validate --config /etc/caddy/Caddyfile

  e2e:
    # Playwright against the real stack: Postgres, Mailpit, SeaweedFS, ClamAV, API, worker, Vite dev server.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-trixie@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        ports: ["1025:1025", "8025:8025"]
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-postgres
      REBATE_OWNER_PASSWORD: ci-owner
      REBATE_APP_PASSWORD: ci-app
      REBATE_AI_WRITER_PASSWORD: ci-ai
      REBATE_READONLY_PASSWORD: ci-ro
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --directory backend
      - run: npm ci --no-fund --prefix frontend
      - run: bash infra/scripts/init-db.sh
      - name: migrate
        working-directory: backend
        env:
          DATABASE_URL_OWNER: postgresql+psycopg://rebate_owner:ci-owner@localhost:5432/rebate
        run: uv run alembic upgrade head
      - name: start SeaweedFS and ClamAV
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e S3_ACCESS_KEY_ID=ci-s3-access -e S3_SECRET_ACCESS_KEY=ci-s3-secret-not-sensitive \
            -e WEED_S3_SSE_KEY="$(openssl rand -hex 32)" \
            -v "$PWD/infra/seaweedfs:/opt/seaweedfs:ro" --entrypoint sh \
            chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860 /opt/seaweedfs/start.sh
          docker run -d --name clamav -p 3310:3310 -e CLAMAV_NO_FRESHCLAMD=true \
            -v "$PWD/infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            clamav/clamav:1.4.6-debian13-slim@sha256:aedee9daad6b069b26adad61af7ec50a41efe33fd8eff7f985c1f31e3a6ae9de
          for i in $(seq 120); do nc -z localhost 8333 && break; sleep 1; done
          for i in $(seq 180); do docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break; sleep 2; done
          docker exec clamav clamdcheck.sh
      - name: start API, worker and dev server
        run: |
          export APP_ENV=ci SECRET_KEY="$(openssl rand -hex 32)" \
            ENCRYPTION_KEYS="k1:$(openssl rand -base64 32)" \
            DATABASE_URL=postgresql+psycopg://rebate_app:ci-app@localhost:5432/rebate \
            PUBLIC_BASE_URL=http://localhost:5173 SMTP_HOST=localhost SMTP_PORT=1025 \
            S3_ENDPOINT_URL=http://localhost:8333 S3_PUBLIC_ENDPOINT_URL=http://localhost:8333 \
            S3_ACCESS_KEY_ID=ci-s3-access S3_SECRET_ACCESS_KEY=ci-s3-secret-not-sensitive \
            CLAMD_HOST=localhost CLAMD_PORT=3310 TRUSTED_PROXY_IPS=127.0.0.1,::1
          (cd backend && nohup uv run uvicorn rebate.api.asgi:app --port 8000 > ../api.log 2>&1 &)
          (cd backend && nohup uv run python -m rebate.workers > ../worker.log 2>&1 &)
          (cd frontend && VITE_DEV_API_PROXY=http://localhost:8000 nohup npx vite --port 5173 > ../vite.log 2>&1 &)
          for i in $(seq 60); do curl -sf http://localhost:5173/api/v1/health/ready && break; sleep 1; done
          curl -sf http://localhost:5173/api/v1/health/ready
      - name: Install Playwright Chromium (apt mirrors flake on runners; retry)
        run: |
          for i in 1 2 3; do npx --prefix frontend playwright install --with-deps chromium && exit 0; sleep 60; done
          exit 1
      - name: Playwright (W1-W2, files, accessibility)
        working-directory: frontend
        run: npx playwright test
      - name: no skipped tests
        run: python3 infra/scripts/check-no-skips.py frontend/junit-e2e.xml
      - name: logs on failure
        if: failure()
        run: |
          tail -n 200 api.log worker.log vite.log
          # page snapshot of each failed test (no artifacts are uploaded)
          find frontend/test-results -name error-context.md -exec sh -c 'echo "== $1"; head -c 20000 "$1"' _ {} \;
