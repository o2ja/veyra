# Owner decision D-N8 (2026-11-13): weekly dependency updates, grouped per ecosystem (one PR each).
# Dependabot PRs go through the normal merge gate (CLAUDE.md §19); nothing auto-merges.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    groups: { docker: { patterns: ["*"] } }
